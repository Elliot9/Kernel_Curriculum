<title>Linux Kernel Developer 養成路徑 · 教材總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#10100e;
    --ink-2:#1a1916;
    --ink-3:#24221d;
    --paper:#f4ecd8;
    --paper-dim:#cfc6b0;
    --amber:#e8a33d;
    --amber-bright:#ffb84d;
    --rust:#c2603a;
    --sage:#8a9a5b;
    --sky:#6fa8b8;
    --line:#3a372f;
    --line-soft:#2c2a24;
    --mono:'JetBrains Mono',monospace;
    --serif:'Newsreader',Georgia,serif;
    --tc:'Noto Sans TC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--tc);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(111,168,184,.04), transparent 45%);
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:var(--ink)}

  /* ---- top masthead ---- */
  .masthead{
    border-bottom:1px solid var(--line);
    padding:3.5rem 2rem 2.5rem;
    max-width:1180px;margin:0 auto;
    position:relative;
  }
  .masthead::before{
    content:"// SINGLE SOURCE OF TRUTH";
    font-family:var(--mono);font-size:.7rem;letter-spacing:.3em;
    color:var(--amber);opacity:.7;display:block;margin-bottom:1.4rem;
  }
  .masthead h1{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(2.2rem,5vw,3.6rem);
    line-height:1.05;letter-spacing:-.02em;
    color:var(--paper);margin-bottom:.8rem;
  }
  .masthead h1 .accent{color:var(--amber-bright);font-style:italic}
  .masthead .sub{
    font-family:var(--serif);font-size:1.15rem;
    color:var(--paper-dim);max-width:60ch;font-style:italic;
  }
  .meta-row{
    display:flex;flex-wrap:wrap;gap:2rem;margin-top:2rem;
    font-family:var(--mono);font-size:.78rem;
  }
  .meta-row .m{display:flex;flex-direction:column;gap:.2rem}
  .meta-row .m .k{color:var(--paper-dim);opacity:.6;letter-spacing:.1em;font-size:.68rem}
  .meta-row .m .v{color:var(--amber);font-weight:700;font-size:1.1rem}
  .learner-note{
    margin-top:1.8rem;padding:1rem 1.2rem;
    border-left:3px solid var(--rust);
    background:var(--ink-2);
    font-size:.92rem;color:var(--paper-dim);
    max-width:70ch;
  }
  .learner-note b{color:var(--paper)}

  /* ---- search ---- */
  .search-wrap{max-width:1180px;margin:2rem auto 0;padding:0 2rem}
  #search{
    width:100%;padding:.9rem 1.1rem;
    background:var(--ink-2);border:1px solid var(--line);
    color:var(--paper);font-family:var(--mono);font-size:.95rem;
    border-radius:2px;transition:border-color .2s;
  }
  #search:focus{outline:none;border-color:var(--amber)}
  #search::placeholder{color:var(--paper-dim);opacity:.5}

  /* ---- legend ---- */
  .legend{
    max-width:1180px;margin:1.2rem auto 0;padding:0 2rem;
    display:flex;flex-wrap:wrap;gap:1.4rem;
    font-family:var(--mono);font-size:.72rem;color:var(--paper-dim);
  }
  .legend .lg{display:flex;align-items:center;gap:.45rem}
  .dot{width:.7rem;height:.7rem;border-radius:50%;display:inline-block}
  .dot.direct{background:var(--rust)}
  .dot.indirect{background:var(--sky)}
  .dot.base{background:var(--paper-dim)}
  .dot.gate{background:var(--amber)}

  /* ---- phase spine ---- */
  .spine{max-width:1180px;margin:2.5rem auto 5rem;padding:0 2rem}
  .phase{
    margin-bottom:3rem;border:1px solid var(--line-soft);
    border-radius:4px;overflow:hidden;background:var(--ink-2);
    transition:border-color .25s;
  }
  .phase:hover{border-color:var(--line)}
  .phase-head{
    display:grid;grid-template-columns:auto 1fr auto;
    gap:1.4rem;align-items:center;
    padding:1.6rem 1.8rem;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(90deg,var(--ink-3),transparent);
    cursor:pointer;
  }
  .phase-id{
    font-family:var(--mono);font-weight:800;font-size:2rem;
    color:var(--ink);background:var(--amber);
    width:3.4rem;height:3.4rem;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;letter-spacing:-.05em;
  }
  .phase-meta h2{
    font-family:var(--serif);font-weight:600;font-size:1.4rem;
    color:var(--paper);letter-spacing:-.01em;margin-bottom:.25rem;
  }
  .phase-meta .goal{font-size:.88rem;color:var(--paper-dim);max-width:75ch;line-height:1.55}
  .phase-stat{
    font-family:var(--mono);font-size:.72rem;text-align:right;
    color:var(--paper-dim);flex-shrink:0;line-height:1.8;
  }
  .phase-stat .big{color:var(--amber);font-size:1rem;font-weight:700}

  /* ---- task grid ---- */
  .task-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:1px;background:var(--line-soft);
  }
  .task{
    background:var(--ink-2);padding:1.1rem 1.3rem;
    text-decoration:none;color:inherit;display:block;
    transition:background .18s;position:relative;
    border-left:3px solid transparent;
  }
  .task:hover{background:var(--ink-3);border-left-color:var(--amber)}
  .task .tid{
    font-family:var(--mono);font-size:.72rem;font-weight:700;
    color:var(--amber);letter-spacing:.05em;
  }
  .task .ttitle{
    font-family:var(--tc);font-size:.95rem;font-weight:500;
    color:var(--paper);margin:.35rem 0 .5rem;line-height:1.4;
  }
  .task .tfoot{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:.68rem;color:var(--paper-dim);
  }
  .task .tdot{display:flex;gap:.35rem;align-items:center}
  .task .gate-badge{
    position:absolute;top:.7rem;right:.8rem;
    font-family:var(--mono);font-size:.6rem;
    background:var(--amber);color:var(--ink);
    padding:.1rem .4rem;border-radius:2px;font-weight:700;letter-spacing:.05em;
  }
  .task.is-stub{opacity:.55}
  .task.is-stub .ttitle::after{
    content:" · 待撰寫";font-size:.7rem;color:var(--paper-dim);font-weight:400;
  }
  .task.is-ready .tid::before{content:"● ";color:var(--sage);font-size:.6rem;vertical-align:middle}

  /* ---- footer ---- */
  footer{
    border-top:1px solid var(--line);max-width:1180px;
    margin:0 auto;padding:2.5rem 2rem 4rem;
    font-family:var(--mono);font-size:.75rem;color:var(--paper-dim);
  }
  footer .links{display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem}
  footer a{color:var(--amber);text-decoration:none;border-bottom:1px dotted var(--amber)}
  .hidden{display:none!important}

  @media(max-width:640px){
    .phase-head{grid-template-columns:auto 1fr;gap:1rem}
    .phase-stat{grid-column:1/-1;text-align:left;display:flex;gap:1.2rem;margin-top:.5rem}
    .masthead{padding:2.5rem 1.3rem 2rem}
    .spine,.search-wrap,.legend,.masthead,footer{padding-left:1.3rem;padding-right:1.3rem}
  }
</style>
</head>

const spine = document.getElementById('spine');
REGISTRY.phases.forEach(ph=>{
  const sec=document.createElement('section');
  sec.className='phase';
  sec.dataset.pid=ph.id;
  const tasksHtml = ph.tasks.map(tid=>{
    const ready = READY.includes(tid);
    const scope = SCOPE[tid]||'base';
    const title = TITLES[tid]||tid;
    const isGate = (tid===ph.gate);
    const href = ready ? ('tasks/'+tid+'.html') : '#';
    const cls = ['task', ready?'is-ready':'is-stub'].join(' ');
    const scopeLabel = scope==='direct'?'直接對應':scope==='indirect'?'間接相關':'基礎能力';
    return `<a class="${cls}" href="${href}" data-tid="${tid}" data-title="${title.toLowerCase()}" data-scope="${scope}">
      ${isGate?'<span class="gate-badge">關卡</span>':''}
      <span class="tid">${tid}</span>
      <div class="ttitle">${title}</div>
      <div class="tfoot">
        <span class="tdot"><span class="dot ${scope}"></span>${scopeLabel}</span>
        <span>${ready?'閱讀 →':'—'}</span>
      </div>
    </a>`;
  }).join('');
  sec.innerHTML = `
    <div class="phase-head">
      <div class="phase-id">${ph.id}</div>
      <div class="phase-meta">
        <h2>${ph.name}</h2>
        <div class="goal">${ph.goal}</div>
      </div>
      <div class="phase-stat">
        <div><span class="big">${ph.tasks.length}</span> tasks</div>
        <div>${ph.hours} 小時</div>
        <div>${ph.weeks} 週</div>
      </div>
    </div>
    <div class="task-grid">${tasksHtml}</div>`;
  spine.appendChild(sec);
});

// === search ===
const search=document.getElementById('search');
search.addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.task').forEach(t=>{
    const hay=(t.dataset.tid+' '+t.dataset.title).toLowerCase();
    t.classList.toggle('hidden', q && !hay.includes(q));
  });
  // hide empty phases
  document.querySelectorAll('.phase').forEach(p=>{
    const any=[...p.querySelectorAll('.task')].some(t=>!t.classList.contains('hidden'));
    p.classList.toggle('hidden', q && !any);
  });
});
